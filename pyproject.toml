[project]
name = "indexed"
version = "0.1.0"
description = "Lightweight codebase Q&A tool built with retrieval-augmented generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "faiss-cpu>=1.8.0",
    "chromadb==1.5.9",
    "onnxruntime>=1.14.1,<1.24",
    "numpy>=1.26.0",
    "gitpython>=3.1.43",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "pyfiglet>=1.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
